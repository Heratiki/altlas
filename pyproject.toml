[project]
name = "altlas"
version = "0.1.0"
description = "AltLAS training loop"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "requests",
    "aiohttp",
    "rich",
    "matplotlib",
]

[project.optional-dependencies]
# Pick exactly one extra: uv sync --extra cpu (default path) or --extra gfx101x.
cpu = ["torch"]
gfx101x = [
    # AMD multi-arch nightly of 2026-08-22: a base torch wheel plus a gfx1010 device wheel.
    "torch==2.14.0+rocm10.1.0a20260822",
    "amd-torch-device-gfx1010==2.14.0+rocm10.1.0a20260822",
    # Transitive pre-releases are pinned here so no global prerelease setting is needed.
    "rocm==10.1.0a20260822",
    "rocm-sdk-core==10.1.0a20260822",
    "rocm-sdk-libraries==10.1.0a20260822",
    "rocm-sdk-device-gfx1010==10.1.0a20260822",
    "triton==3.8.0+git675c5987.rocm10.1.0a20260822",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cpu" }, { extra = "gfx101x" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "therock-multi-arch"
url = "https://rocm.nightlies.amd.com/whl-multi-arch/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "therock-multi-arch", extra = "gfx101x" },
]
amd-torch-device-gfx1010 = [{ index = "therock-multi-arch", extra = "gfx101x" }]
triton = [{ index = "therock-multi-arch", extra = "gfx101x" }]
rocm = [{ index = "therock-multi-arch", extra = "gfx101x" }]
rocm-bootstrap = [{ index = "therock-multi-arch" }]
rocm-sdk-core = [{ index = "therock-multi-arch", extra = "gfx101x" }]
rocm-sdk-libraries = [{ index = "therock-multi-arch", extra = "gfx101x" }]
rocm-sdk-device-gfx1010 = [{ index = "therock-multi-arch", extra = "gfx101x" }]
